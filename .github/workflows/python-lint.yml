name: Python Lint and Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry==2.1.2

      - name: Install dependencies
        run: poetry install

      - name: Run ruff check
        run: poetry run ruff check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry==2.1.2

      - name: Install dependencies
        run: poetry install

      - name: Generate ArangoDB password
        id: arango-pw
        run: echo "password=$(openssl rand -hex 16)" >> "$GITHUB_OUTPUT"

      - name: Run tests
        env:
          ARANGO_DB_PASSWORD: ${{ steps.arango-pw.outputs.password }}
        run: poetry run pytest --junitxml=pytest-results.xml

      - name: Publish Test Report
        uses: ctrf-io/github-test-reporter@0f299074936c32ccaab5be5230511f6b2b9080aa  # v1
        if: always()
        with:
          report-path: 'python/pytest-results.xml'
          summary-report: true
          pull-request-report: true
          integrations-config: |
                  {
                    "junit-to-ctrf": {
                      "enabled": true,
                      "action": "convert"
                    }
                  }
