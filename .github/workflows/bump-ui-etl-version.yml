name: Bump nlm-ckn-ui ETL_VERSION

# Closes the loop between an ETL release and the UI that serves its dataset.
# Tracking issue: https://github.com/Springbok-LLC/nlm-ckn-ui/issues/167
#
# A release run is submitted to AWS Batch by trigger-release.sh, which returns
# immediately after submission. The container running release.py reports the
# outcome back as GitHub *deployment statuses* on this repo. This workflow
# listens for those statuses and does one of two things:
#
#   success           -> open (or update) a PR on Springbok-LLC/nlm-ckn-ui that
#                        writes the released run name into that repo's root
#                        ETL_VERSION file.
#   failure | error   -> open (or update) an issue *here* reporting the failed
#                        release, with the status description and CloudWatch log
#                        link, so a dead release is never silent.
#
# -- The version contract (why the value must be the ETL *run name*) ----------
# The pipeline uploads the golden dump to
#   s3://$S3_BUCKET/runs/{run_name}/06-golden-dump.tar.gz
# and the UI's scripts/app/deploy-dataset.sh reads its root ETL_VERSION file and
# rebuilds exactly that key. So ETL_VERSION must contain the run name verbatim
# (e.g. "v1.6.0-rc.4"), one line, nothing else.
#
# The run name is read from the deployment's payload.run_name, which
# trigger-release.sh sets from the resolved run name. It is deliberately NOT
# derived from the deployment ref: ref equals the run name only because
# on-release.yml happens to pass the release tag as --run-name. A manual
# trigger-release.yml dispatch can set --run-name to something else, and pinning
# the ref in that case would point the UI at an S3 prefix that does not exist.
# If the payload field is missing (a deployment created by an older copy of
# trigger-release.sh) this workflow FAILS LOUDLY rather than guessing.
#
# -- What the deployment object carries, and what is looked up ----------------
# trigger-release.sh sets exactly three fields this workflow reads:
#   ref          the value of GITHUB_REF_NAME at submission time. In practice
#                always the ETL release tag, because on-release.yml is the only
#                path that sets GITHUB_DEPLOY_TOKEN and it runs on
#                release: [published]. Used only to *find* the release.
#   description  the string "nlm-ckn <TAG>", naming the upstream nlm-ckn tag
#                the dataset was built from. Parsed defensively below - it is
#                free text on the API and must never be assumed well formed.
#   payload      {"run_name": "<RUN>"} - the S3 prefix, see the contract above.
#
# The originating GitHub Release is deliberately NOT plumbed through the
# payload. It is resolved at PR/issue time with
# `gh api repos/{repo}/releases/tags/{ref}`, because that:
#   * works for deployments created before this workflow existed,
#   * reflects the release as it is *now* (renamed, notes edited, retargeted)
#     rather than as it was at submission time, and
#   * simply finds nothing when someone ran trigger-release.sh by hand with
#     GITHUB_DEPLOY_TOKEN set and no release behind the ref - which would
#     otherwise have to be handled as an error inside the release script.
# Every use of the resolved release is optional: a missing release drops one
# line from the PR/issue body and nothing else. It must never fail a bump or
# suppress a failure report.
#
# -- Where the three markdown bodies come from --------------------------------
# The PR body, the failure-issue body and the release annotation are rendered
# by .github/scripts/render_bodies.py from .github/templates/*.md. The prose
# lives in the templates; every conditional section is a single placeholder the
# script fills in. Event-controlled text still reaches the script only through
# env: entries read from os.environ, and is still escaped there - see the
# script's header for why str.format cannot be turned into an injection.
#
# Consequence for this file: EVERY job that renders a body must check this repo
# out, and must do so BEFORE any sibling checkout, because actions/checkout
# cleans the workspace it lands in. The renderer is invoked by absolute path
# ($GITHUB_WORKSPACE) since the bump job runs it with cwd inside sibling/.
# Unit tests for the renderer live in python/tests/RenderBodiesTestCase.py and
# run in the normal python-lint.yml pytest job.
#
# -- Known limitation 1: infra-level failures are a blind spot ----------------
# Every deployment status this workflow reacts to is posted by release.py from
# inside the Batch container. Anything that kills the container before Python
# can report -- Batch job timeout, OOM kill, spot reclaim, image pull failure, a
# crash before the entrypoint reaches Python -- produces NO deployment status,
# and therefore NO issue from this workflow. Such a release fails completely
# silently as far as GitHub is concerned. Closing that gap requires an
# EventBridge rule on "Batch Job State Change" -> FAILED, which belongs in the
# nlm-ckn-iac repo. Tracked as a known gap; intentionally NOT implemented here.
#
# -- Known limitation 2: this only fires because PATs create the events -------
# GitHub Actions suppresses events generated with the default Actions token, to
# stop workflows triggering themselves. This workflow runs only because BOTH
# halves of the chain are authenticated with PATs:
#   * the deployment is created by trigger-release.sh using DEPLOYMENTS_TOKEN
#     (passed in as GITHUB_DEPLOY_TOKEN by on-release.yml), and
#   * the statuses are posted by release.py in the container using the PAT
#     injected from Secrets Manager.
# Swapping either one to the Actions-provided token silently disables this
# workflow: no event, no run, no error anywhere. That is by far the most likely
# way for this automation to break invisibly -- check it first if releases stop
# bumping the UI.

on:
  deployment_status:
  # Manual escape hatch: exercise the success path (or re-pin a version) without
  # waiting for a real release. dry_run stops short of pushing/opening the PR.
  workflow_dispatch:
    inputs:
      version:
        description: 'ETL run name to pin in nlm-ckn-ui/ETL_VERSION (e.g. v1.6.0-rc.4)'
        required: true
        type: string
      dry_run:
        description: 'Resolve and diff only - do not push a branch or open a PR'
        required: false
        type: boolean
        default: false

# Serialize: release.py can post several statuses in one run, and a re-dispatch
# can overlap a real release. Two runs must not race on the bump branch, the PR,
# or the failure issue. Never cancel - a dropped run means a missed bump/report.
concurrency:
  group: bump-ui-etl-version
  cancel-in-progress: false

# Deliberately minimal. All cross-repo work (pushing the branch and opening the
# PR on nlm-ckn-ui) is done with a PAT, which carries its own permissions and
# ignores these entirely. Nothing here reads this repo's contents either, but
# contents: read is the smallest sane default. The failure job widens this
# locally to issues: write - see its own permissions block.
permissions:
  contents: read

jobs:
  # -- Success path: pin the released run name in nlm-ckn-ui -------------------
  bump:
    name: Bump ETL_VERSION in nlm-ckn-ui
    # Only Springbok-LLC (the NIH-NLM mirror must never open PRs on our UI
    # repo), only production deployments, and only the terminal success status -
    # in_progress / pending / queued / inactive are ignored.
    if: >-
      github.repository_owner == 'Springbok-LLC' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'deployment_status' &&
          github.event.deployment.environment == 'production' &&
          github.event.deployment_status.state == 'success'
        )
      )
    runs-on: ubuntu-latest
    env:
      SIBLING_REPO: Springbok-LLC/nlm-ckn-ui
      SIBLING_PATH: ETL_VERSION
      BUMP_BRANCH: bump/etl-version
      # This (ETL) repo - the release lookup below reads from here, everything
      # else in this job writes to SIBLING_REPO.
      THIS_REPO: ${{ github.repository }}
      # Empty for deployment_status events; 'true'/'false' on workflow_dispatch.
      DRY_RUN: ${{ inputs.dry_run }}
      # PAT with contents:write + pull_requests:write on BOTH
      # Springbok-LLC/nlm-ckn-etl and Springbok-LLC/nlm-ckn-ui. The default
      # Actions token cannot push to another repo, so this secret is required.
      # Shared with sync-collection-maps.yml.
      GH_TOKEN: ${{ secrets.COLLECTION_MAPS_SYNC_TOKEN }}
    steps:
      # This repo is checked out only for .github/scripts/render_bodies.py and
      # .github/templates/*.md, which build the PR body. It MUST come before
      # the sibling checkout: actions/checkout cleans the workspace it lands
      # in, so a root checkout running second would delete sibling/.
      # persist-credentials: false because nothing here pushes to this repo -
      # the push below is to SIBLING_REPO, using the PAT in sibling/.git.
      - name: Checkout this repo (body templates and renderer)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      # Both trigger paths funnel through this one step, so everything
      # downstream sees a single validated value regardless of event type.
      # Event- and input-controlled text is mapped to env, never interpolated
      # into the script body (mirrors trigger-release.yml).
      - name: Resolve and validate the ETL version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          PAYLOAD_RUN_NAME: ${{ github.event.deployment.payload.run_name }}
          DEPLOYMENT_REF: ${{ github.event.deployment.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
            SOURCE="workflow_dispatch input"
          else
            VERSION="$PAYLOAD_RUN_NAME"
            SOURCE="deployment payload.run_name"
          fi

          # Fail loudly rather than falling back to the deployment ref. A
          # missing payload means the deployment came from a trigger-release.sh
          # that predates the payload.run_name change; pinning the ref instead
          # could point the UI at a runs/ prefix that does not exist in S3.
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine the ETL version from $SOURCE." \
                 "Deployment ref was '${DEPLOYMENT_REF:-<none>}'. If this deployment" \
                 "was created by an older trigger-release.sh, re-run the release with" \
                 "the current script (it sets the deployment payload run_name), or" \
                 "dispatch this workflow manually with an explicit version input."
            exit 1
          fi

          # Strict allowlist before this value reaches a file, a branch name, or
          # any shell/API argument.
          if ! printf '%s' "$VERSION" | grep -Eq '^[A-Za-z0-9._-]{1,100}$'; then
            echo "::error::Refusing to use ETL version '$VERSION' from $SOURCE:" \
                 "it must match ^[A-Za-z0-9._-]{1,100}\$."
            exit 1
          fi
          case "$VERSION" in
            *..*|-*|.*)
              echo "::error::Refusing to use ETL version '$VERSION': a leading dot or dash, or '..', is not a valid run name."
              exit 1
              ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved ETL version '$VERSION' from $SOURCE."

      # Gives the reviewer on nlm-ckn-ui a one-click route back to the ETL
      # release that produced this dataset. See the header for why the release
      # is looked up here instead of being carried in the deployment payload.
      #
      # Strictly best effort. continue-on-error plus a bare `|| true` shape
      # inside: a rate-limited API, a PAT without read access to this repo, or
      # a ref with no release behind it must all degrade to "no release
      # section in the PR body", never to a skipped bump.
      - name: Resolve the originating GitHub Release (best effort)
        id: release
        continue-on-error: true
        env:
          # deployment.ref is empty on workflow_dispatch; the loop below then
          # falls back to the version itself, which is the release tag on every
          # release-driven run (on-release.yml passes the tag as --run-name).
          DEPLOYMENT_REF: ${{ github.event.deployment.ref }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # No -e: every failure here is expected and non-fatal.
          set -uo pipefail

          # Exported for the body-generating step later in this job, which
          # treats the file's absence as "no release was found". RUNNER_TEMP is
          # only readable at step runtime, hence GITHUB_ENV rather than a
          # job-level env entry.
          RELEASE_FILE="$RUNNER_TEMP/release.json"
          echo "RELEASE_FILE=$RELEASE_FILE" >> "$GITHUB_ENV"
          rm -f "$RELEASE_FILE"

          CANDIDATES=("${DEPLOYMENT_REF:-}" "$VERSION")
          # A run name is conventionally the tag with the leading 'v' stripped
          # (see trigger-release.sh), so try re-adding it before giving up.
          case "$VERSION" in v*) ;; *) CANDIDATES+=("v$VERSION") ;; esac

          TRIED=""
          for CAND in "${CANDIDATES[@]}"; do
            [ -n "$CAND" ] || continue
            # This value lands in an API path, so allowlist it exactly as the
            # version is allowlisted. Slashes are permitted because git tags
            # may legitimately contain them; '..' and a leading dot or dash are
            # not, so no candidate can walk out of the releases/tags/ prefix.
            printf '%s' "$CAND" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,254}$' || continue
            case "$CAND" in *..*) continue ;; esac
            case " $TRIED " in *" $CAND "*) continue ;; esac
            TRIED="$TRIED $CAND"

            if gh api "repos/$THIS_REPO/releases/tags/$CAND" > "$RELEASE_FILE" 2>/dev/null; then
              echo "::notice::Matched ETL release tag '$CAND'."
              break
            fi
            rm -f "$RELEASE_FILE"
          done

          if [ -s "$RELEASE_FILE" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No published release matched${TRIED:+ any of:$TRIED} - the PR body will say so (non-fatal)."
          fi

      - name: Checkout nlm-ckn-ui
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: ${{ env.SIBLING_REPO }}
          token: ${{ secrets.COLLECTION_MAPS_SYNC_TOKEN }}
          path: sibling
          fetch-depth: 0

      - name: Write ETL_VERSION and detect drift
        id: drift
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ ! -f "sibling/$SIBLING_PATH" ]; then
            echo "::warning::$SIBLING_REPO has no $SIBLING_PATH at its root - this PR will create it."
          fi
          # One line, no trailing junk: deploy-dataset.sh interpolates this
          # straight into the S3 key.
          printf '%s\n' "$VERSION" > "sibling/$SIBLING_PATH"

          cd sibling
          # git status, not git diff: the file may be untracked (first bump),
          # which git diff would report as no change.
          if [ -z "$(git status --porcelain -- "$SIBLING_PATH")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$SIBLING_REPO already pins ETL_VERSION=$VERSION - nothing to do."
            # Already at the target version, so any bump PR still open from this
            # branch is moot (e.g. it was merged by hand, or the same version was
            # re-released). Close it so a stale PR doesn't linger. Skipped on a
            # dry run, which must not mutate the sibling repo.
            if [ "${DRY_RUN:-}" != "true" ]; then
              OWNER="${SIBLING_REPO%%/*}"
              STALE=$(gh api -X GET "repos/$SIBLING_REPO/pulls" \
                -F head="$OWNER:$BUMP_BRANCH" -F base=main -F state=open \
                --jq '.[0].number // empty')
              if [ -n "$STALE" ]; then
                gh api "repos/$SIBLING_REPO/issues/$STALE/comments" \
                  -f body="ETL_VERSION on \`main\` already pins \`$VERSION\` - closing this stale bump PR automatically." >/dev/null 2>&1 || true
                gh api -X PATCH "repos/$SIBLING_REPO/pulls/$STALE" -f state=closed >/dev/null
                echo "::notice::Closed stale bump PR #$STALE on $SIBLING_REPO (already at $VERSION)."
              fi
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::ETL_VERSION on $SIBLING_REPO differs from $VERSION - opening/updating a bump PR."
          fi

      - name: Dry run - stop before pushing
        if: steps.drift.outputs.changed == 'true' && env.DRY_RUN == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "::notice::Dry run: would bump $SIBLING_REPO/$SIBLING_PATH to $VERSION on branch $BUMP_BRANCH."
          cd sibling
          git --no-pager diff -- "$SIBLING_PATH" || true

      - name: Push branch and open or update PR
        if: steps.drift.outputs.changed == 'true' && env.DRY_RUN != 'true'
        # Everything event-controlled reaches the body generator through env
        # and is read from os.environ - never interpolated into the script
        # text, which would be an expression-injection hole. Empty on a
        # workflow_dispatch run, which the generator handles as "unknown".
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOYMENTS_URL: ${{ github.server_url }}/${{ github.repository }}/deployments
          DEPLOYMENT_ID: ${{ github.event.deployment.id }}
          DEPLOYMENT_REF: ${{ github.event.deployment.ref }}
          DEPLOYMENT_DESCRIPTION: ${{ github.event.deployment.description }}
          LOG_URL: ${{ github.event.deployment_status.log_url }}
        run: |
          set -euo pipefail
          cd sibling

          git config user.name  "nlm-ckn-sync-bot"
          git config user.email "nlm-ckn-sync-bot@users.noreply.github.com"

          # Recreate a single fixed branch at main HEAD each run so successive
          # releases update one branch/PR rather than piling up new ones.
          git checkout -B "$BUMP_BRANCH"
          git add "$SIBLING_PATH"
          git commit -m "Bump ETL_VERSION to $VERSION" \
                     -m "Automated from a successful nlm-ckn-etl production release."
          git push --force origin "$BUMP_BRANCH"

          # Body rendered from .github/templates/bump-pr-body.md by
          # .github/scripts/render_bodies.py, rather than a heredoc + sed on
          # placeholders: most of the provenance in it is optional (there may
          # be no release, no CloudWatch URL, no deployment at all on a manual
          # dispatch), and sed cannot drop a line conditionally. It also keeps
          # untrusted event text - the deployment description in particular -
          # as *data* that the renderer reads from the environment and escapes
          # on the way in, instead of text spliced into markdown.
          #
          # Absolute path: cwd is sibling/ at this point, so a relative path
          # would resolve inside the sibling checkout.
          python3 "$GITHUB_WORKSPACE/.github/scripts/render_bodies.py" \
            bump-pr "$RUNNER_TEMP/pr_body.md"

          BODY="$(cat "$RUNNER_TEMP/pr_body.md")"
          TITLE="📦 Bump ETL_VERSION to $VERSION"

          # Use the API directly - gh pr list is unreliable for a head branch
          # that was just force-pushed (mirrors sync-collection-maps.yml).
          OWNER="${SIBLING_REPO%%/*}"
          EXISTING=$(gh api -X GET "repos/$SIBLING_REPO/pulls" \
            -F head="$OWNER:$BUMP_BRANCH" -F base=main -F state=open \
            --jq '.[0].number // empty')

          if [ -z "$EXISTING" ]; then
            PR_NUM=$(gh api "repos/$SIBLING_REPO/pulls" \
              -f title="$TITLE" \
              -f head="$BUMP_BRANCH" \
              -f base=main \
              -f body="$BODY" \
              --jq '.number')
            echo "::notice::Opened bump PR #$PR_NUM on $SIBLING_REPO for $VERSION."
          else
            PR_NUM=$EXISTING
            # Retitle as well as re-body: a PR left open on this branch names the
            # previous version.
            gh api -X PATCH "repos/$SIBLING_REPO/pulls/$PR_NUM" \
              -f title="$TITLE" -f body="$BODY" >/dev/null
            echo "::notice::Updated existing bump PR #$PR_NUM on $SIBLING_REPO to $VERSION."
          fi

          # Best-effort label so these PRs are filterable. Non-fatal: a missing
          # label or a token without labels scope must not fail the bump.
          gh api "repos/$SIBLING_REPO/issues/$PR_NUM/labels" \
            -f "labels[]=automated-sync" >/dev/null 2>&1 || \
            echo "::notice::Could not add 'automated-sync' label (non-fatal)."

  # -- Failure path: report a dead release as an issue on this repo ------------
  report-failure:
    name: Report failed release
    if: >-
      github.repository_owner == 'Springbok-LLC' &&
      github.event_name == 'deployment_status' &&
      github.event.deployment.environment == 'production' &&
      (
        github.event.deployment_status.state == 'failure' ||
        github.event.deployment_status.state == 'error'
      )
    runs-on: ubuntu-latest
    # The issue is filed in THIS repo, so the Actions token is enough - no PAT
    # needed here (and the sync PAT is scoped for contents + pull requests
    # only). Overrides the top-level contents: read for this job alone.
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      THIS_REPO: ${{ github.repository }}
    # Consumed by annotate-release, which is a separate job purely so that
    # contents: write is not granted to the job that files the issue.
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      issue_url: ${{ steps.issue.outputs.url }}
    steps:
      # Only for .github/scripts/render_bodies.py and .github/templates/*.md,
      # which build the issue body. Nothing here writes to the repo, so no
      # credentials are persisted.
      - name: Checkout this repo (body templates and renderer)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      # Same best-effort lookup as the bump job, and for the same reason: a
      # human reading the failure issue should be one click from the release
      # that started the run. See the header for why this is a lookup rather
      # than a deployment payload field. Non-fatal in every direction - a
      # release that cannot be found must not stop a failure being reported.
      - name: Resolve the originating GitHub Release (best effort)
        id: release
        continue-on-error: true
        env:
          DEPLOYMENT_REF: ${{ github.event.deployment.ref }}
          PAYLOAD_RUN_NAME: ${{ github.event.deployment.payload.run_name }}
        run: |
          # No -e: every failure here is expected and non-fatal.
          set -uo pipefail

          # Exported for the body-generating step later in this job, which
          # treats the file's absence as "no release was found". RUNNER_TEMP is
          # only readable at step runtime, hence GITHUB_ENV rather than a
          # job-level env entry.
          RELEASE_FILE="$RUNNER_TEMP/release.json"
          echo "RELEASE_FILE=$RELEASE_FILE" >> "$GITHUB_ENV"
          rm -f "$RELEASE_FILE"

          CANDIDATES=("${DEPLOYMENT_REF:-}" "${PAYLOAD_RUN_NAME:-}")
          case "${PAYLOAD_RUN_NAME:-}" in
            ""|v*) ;;
            *) CANDIDATES+=("v${PAYLOAD_RUN_NAME}") ;;
          esac

          TRIED=""
          for CAND in "${CANDIDATES[@]}"; do
            [ -n "$CAND" ] || continue
            # Allowlisted before it reaches an API path: slashes are allowed
            # (git tags may contain them), '..' and a leading dot or dash are
            # not, so no candidate can walk out of the releases/tags/ prefix.
            printf '%s' "$CAND" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,254}$' || continue
            case "$CAND" in *..*) continue ;; esac
            case " $TRIED " in *" $CAND "*) continue ;; esac
            TRIED="$TRIED $CAND"

            if gh api "repos/$THIS_REPO/releases/tags/$CAND" > "$RELEASE_FILE" 2>/dev/null; then
              echo "::notice::Matched ETL release tag '$CAND'."
              break
            fi
            rm -f "$RELEASE_FILE"
          done

          if [ -s "$RELEASE_FILE" ]; then
            # Emitted for annotate-release; an empty value keeps that job from
            # running at all.
            echo "id=$(jq -r '.id // empty' "$RELEASE_FILE")" >> "$GITHUB_OUTPUT"
          else
            echo "id=" >> "$GITHUB_OUTPUT"
            echo "::notice::No published release matched${TRIED:+ any of:$TRIED} - the issue body will say so (non-fatal)."
          fi

      # Everything event-controlled (description, URLs, run name) is passed via
      # env and read from os.environ / shell variables - never interpolated into
      # the script text, which would be an expression-injection hole.
      - name: Open or update the release-failure issue
        id: issue
        env:
          API_URL: ${{ github.api_url }}
          DEPLOYMENTS_URL: ${{ github.server_url }}/${{ github.repository }}/deployments
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ github.event.deployment_status.state }}
          DESCRIPTION: ${{ github.event.deployment_status.description }}
          LOG_URL: ${{ github.event.deployment_status.log_url }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
          DEPLOYMENT_ID: ${{ github.event.deployment.id }}
          DEPLOYMENT_REF: ${{ github.event.deployment.ref }}
          DEPLOYMENT_DESCRIPTION: ${{ github.event.deployment.description }}
          PAYLOAD_RUN_NAME: ${{ github.event.deployment.payload.run_name }}
        run: |
          set -euo pipefail

          # Unlike the bump path, a missing or odd run name must not stop the
          # report - a failed release still needs to be visible. Fall back to
          # the deployment id so the issue title stays stable and safe.
          VERSION="$PAYLOAD_RUN_NAME"
          if ! printf '%s' "$VERSION" | grep -Eq '^[A-Za-z0-9._-]{1,100}$'; then
            echo "::warning::deployment payload run_name is missing or invalid - titling the issue by deployment id."
            VERSION="deployment-$DEPLOYMENT_ID"
          fi

          # Stable title = idempotency key. release.py posts a failure status
          # from each step's except block, so several events can arrive for one
          # run; they all resolve to this title and become comments.
          TITLE="🚨 ETL release failed - $VERSION"
          export TITLE VERSION

          # Body rendered from .github/templates/release-failure-issue.md by
          # .github/scripts/render_bodies.py so untrusted status text is
          # inserted as data (and fenced) rather than expanded by the shell.
          python3 "$GITHUB_WORKSPACE/.github/scripts/render_bodies.py" \
            release-failure-issue "$RUNNER_TEMP/issue_body.md"

          BODY="$(cat "$RUNNER_TEMP/issue_body.md")"

          # Match on exact title among open issues rather than using the search
          # API, whose index lags far enough behind issue creation to duplicate.
          EXISTING=$(gh api -X GET "repos/$THIS_REPO/issues" \
            -F state=open -F per_page=100 \
            --jq '[.[] | select(.pull_request == null) | select(.title == env.TITLE) | .number] | .[0] // empty')

          if [ -n "$EXISTING" ]; then
            ISSUE_NUM="$EXISTING"
            gh api "repos/$THIS_REPO/issues/$ISSUE_NUM/comments" -f body="$BODY" >/dev/null
            echo "::notice::Commented on existing release-failure issue #$ISSUE_NUM."
          else
            ISSUE_NUM=$(gh api "repos/$THIS_REPO/issues" \
              -f title="$TITLE" -f body="$BODY" --jq '.number')
            echo "::notice::Opened release-failure issue #$ISSUE_NUM."
          fi

          # Best-effort label. Non-fatal: a missing 'release-failure' label or a
          # token without labels scope must not fail the report (mirrors
          # sync-collection-maps.yml).
          gh api "repos/$THIS_REPO/issues/$ISSUE_NUM/labels" \
            -f "labels[]=release-failure" >/dev/null 2>&1 || \
            echo "::notice::Could not add 'release-failure' label (non-fatal)."

          # Consumed by annotate-release. Built from the server URL rather than
          # read back from the API so a comment-on-existing-issue run still
          # yields the issue's own URL, not the comment anchor.
          echo "url=$GITHUB_SERVER_URL/$THIS_REPO/issues/$ISSUE_NUM" >> "$GITHUB_OUTPUT"

          echo "::warning::ETL release $VERSION reported '$STATE' - see issue #$ISSUE_NUM."

  # -- Optional: point the Release itself back at the failure issue ------------
  # DEFAULT OFF. Enable by setting the repository variable
  # ANNOTATE_RELEASE_ON_FAILURE to the string 'true'
  # (Settings -> Secrets and variables -> Actions -> Variables).
  #
  # Why this job exists at all: GitHub gives a Release no inbound
  # cross-references. Verified against the live API on this repo -
  #   * GET /repos/{repo}/releases/{id} returns no timeline, comment, reaction
  #     or mention field, and /releases/{id}/comments and /releases/{id}/timeline
  #     are both 404;
  #   * the autolink/cross-reference machinery that makes an issue link show up
  #     on the referenced object covers issues, PRs and commits, not releases;
  #   * the only comment-like surface a release has is a linked Discussion,
  #     which exists only when the release was created with
  #     discussion_category_name. Every release on this repo has
  #     discussion_url: null and the repo has has_discussions: false, so that
  #     route is not available here without a repo-settings change.
  # That leaves exactly one mechanism: PATCH the release body.
  #
  # Why it is off by default: a release body is a public, human-authored
  # artifact, and this rewrites it from CI. That is a real tradeoff, not an
  # oversight - turn it on only if the team wants failure notes on releases.
  # When it is off, nothing here runs and the failure issue is still filed.
  #
  # Safety properties when it IS on:
  #   * idempotent - the note lives between HTML-comment markers and is
  #     replaced wholesale, so the several failure statuses release.py can post
  #     for one run cannot stack up notes;
  #   * no-op when unchanged - the PATCH is skipped if the body already matches,
  #     so repeated statuses do not churn the release's updated_at;
  #   * best effort - continue-on-error, so a protected/immutable release or a
  #     permissions problem cannot turn a reported failure into a red workflow;
  #   * loop-safe - the edit is made with GITHUB_TOKEN, and events generated by
  #     that token do not trigger workflows.
  annotate-release:
    name: Annotate the originating release (opt-in)
    needs: report-failure
    # Separate job purely so contents: write is granted here and not to the job
    # that files the issue. When the flag is off the job never runs, so the
    # permission is never issued.
    if: >-
      vars.ANNOTATE_RELEASE_ON_FAILURE == 'true' &&
      needs.report-failure.outputs.release_id != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write   # required only to PATCH the release body
    steps:
      # Only for .github/scripts/render_bodies.py and
      # .github/templates/release-annotation.md, which build the note. The
      # release is edited through the API, not through this checkout, so no
      # credentials are persisted here either.
      - name: Checkout this repo (note template and renderer)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Append a failure note to the release body
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THIS_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.report-failure.outputs.release_id }}
          ISSUE_URL: ${{ needs.report-failure.outputs.issue_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # No -e: this whole job is decoration on top of an already-filed
          # issue and must never be the thing that fails.
          set -uo pipefail

          # RELEASE_ID comes from .id on a release object we fetched, but it
          # goes into an API path, so require digits before using it.
          if ! printf '%s' "$RELEASE_ID" | grep -Eq '^[0-9]{1,20}$'; then
            echo "::notice::Release id '$RELEASE_ID' is not numeric - skipping (non-fatal)."
            exit 0
          fi

          if ! gh api "repos/$THIS_REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            echo "::notice::Could not read release $RELEASE_ID - skipping (non-fatal)."
            exit 0
          fi

          # Note rendered from .github/templates/release-annotation.md. The
          # renderer replaces any previous block rather than appending, and
          # exits 3 when the release already carries exactly this note.
          python3 "$GITHUB_WORKSPACE/.github/scripts/render_bodies.py" \
            release-annotation "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/patch.json"
          RC=$?

          if [ "$RC" = "3" ]; then
            echo "::notice::Release $RELEASE_ID already carries the current failure note - not patching."
            exit 0
          fi
          if [ "$RC" != "0" ]; then
            echo "::notice::Could not build the release note (exit $RC) - skipping (non-fatal)."
            exit 0
          fi

          if gh api -X PATCH "repos/$THIS_REPO/releases/$RELEASE_ID" \
               --input "$RUNNER_TEMP/patch.json" >/dev/null 2>&1; then
            echo "::notice::Annotated release $RELEASE_ID with the failure note."
          else
            echo "::notice::Could not PATCH release $RELEASE_ID (immutable, protected, or insufficient scope) - skipping (non-fatal)."
          fi
