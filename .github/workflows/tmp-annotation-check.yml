name: TEMP Annotation Check

# TEMPORARY — delete before merging feature/validator-github-annotations.
# Confirms the runner turns workflow commands written to stderr into
# annotations, using the same tee-to-summary step as nlm-ckn's
# validate-data.yml. The job is expected to fail (the fixture has an ERROR).

on:
  push:
    branches: [feature/validator-github-annotations]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas

      - name: Probe stderr workflow command directly
        run: echo "::warning title=stderr-probe::plain echo to stderr" >&2

      - name: Build a fixture tree with one ERROR
        working-directory: python/tests
        run: |
          python - <<'EOF'
          import os
          from pathlib import Path
          from ProductionDataValidatorTestCase import ValidatorFixtureTestCase as T
          t = T("test_good_tree_is_clean")
          tree = t._build(Path(os.environ["GITHUB_WORKSPACE"]) / "data" / "prod")
          tree.summary.unlink()
          EOF

      - name: Run validator (same step as nlm-ckn validate-data.yml)
        env:
          DATA_DIR: data/prod
        working-directory: python/src
        run: |
          set +e
          {
            echo "## Data validation: \`$DATA_DIR\`"
            echo '```text'
          } >> "$GITHUB_STEP_SUMMARY"
          python ProductionDataValidator.py --data-dir "$GITHUB_WORKSPACE/$DATA_DIR" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
